<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="45%" stop-color="#4338ca" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="handGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e0e7ff" />
    </linearGradient>
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#0f172a" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Modern squircle container with subtle inner border -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="#6366f1" stroke-width="1.2" stroke-opacity="0.6" />

  <!-- Subtle ambient radial highlight -->
  <circle cx="24" cy="20" r="18" fill="#ffffff" fill-opacity="0.08" />

  <!-- Hand + Translation Waves Group with Drop Shadow -->
  <g filter="url(#shadow)">
    <!-- Signing Hand Icon (Sign) -->
    <!-- Wrist & Palm base -->
    <path d="M 22 48 
             C 22 51, 34 51, 34 48 
             L 34 37 
             C 34 35, 36 34, 38 34 
             C 40 34, 41 32.5, 41 30.5 
             C 41 28.5, 39.5 27.5, 37.5 27.5
             C 36 27.5, 35 28.2, 34.5 29
             L 34.5 20.5 
             C 34.5 19, 33.2 18, 31.8 18 
             C 30.4 18, 29.2 19, 29.2 20.5 
             L 29.2 16.5 
             C 29.2 15, 28 14, 26.5 14 
             C 25 14, 23.8 15, 23.8 16.5 
             L 23.8 18 
             C 23.8 16.5, 22.6 15.5, 21.2 15.5 
             C 19.8 15.5, 18.6 16.5, 18.6 18 
             L 18.6 32 
             C 17.5 30.8, 15.8 30.5, 14.2 31.8 
             C 12.8 33, 12.8 35.2, 14 36.5 
             L 18 41 
             Z" 
          fill="url(#handGrad)" />

    <!-- Translation / Speech Waves radiating outward (Sent) -->
    <path d="M 40 18 C 44 21, 46.5 25.5, 46.5 30.5 C 46.5 35.5, 44 40, 40 43" 
          fill="none" 
          stroke="url(#waveGrad)" 
          stroke-width="2.6" 
          stroke-linecap="round" />

    <path d="M 46 13 C 51.5 17.5, 54.5 23.5, 54.5 30.5 C 54.5 37.5, 51.5 43.5, 46 48" 
          fill="none" 
          stroke="url(#waveGrad)" 
          stroke-width="2.2" 
          stroke-linecap="round" 
          stroke-opacity="0.8" />

    <!-- Pulse Dot representing translated message -->
    <circle cx="48" cy="19" r="1.5" fill="#38bdf8" />
  </g>
</svg>